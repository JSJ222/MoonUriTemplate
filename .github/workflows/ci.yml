name: MoonBit CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: hustcer/setup-moonbit@v1.23
      - name: Toolchain
        run: moon version --all
      - name: Refresh package registry for clean runners
        run: moon update
      - name: Windows OCaml path compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./tools/windows/build-shim.ps1
          $shim = Join-Path $env:GITHUB_WORKSPACE '_build/windows-path-shims'
          "MOONC_OVERRIDE=$shim/moonc.exe" >> $env:GITHUB_ENV
          "MOONFMT_OVERRIDE=$shim/moonfmt.exe" >> $env:GITHUB_ENV
          "MOONINFO_OVERRIDE=$shim/mooninfo.exe" >> $env:GITHUB_ENV
          $env:MOONC_OVERRIDE = "$shim/moonc.exe"
          Push-Location (Join-Path $env:USERPROFILE '.moon/lib/core')
          moon bundle --all --warn-list -a
          Pop-Location
      - name: Regenerate conformance tests
        run: |
          python tools/generate_conformance.py
          moon fmt
          git diff --exit-code
      - name: Formatting
        run: moon fmt --check
      - name: Check all backends
        run: moon check --target all --deny-warn
      - name: Public interface drift
        run: |
          moon info
          git diff --exit-code
      - name: Build all backends
        run: moon build --target all --deny-warn
      - name: Test all backends
        run: moon test --target all --deny-warn
      - name: Run API example
        run: moon run examples/api --target wasm-gc
      - name: Run MCP example
        run: moon run examples/mcp --target wasm-gc
      - name: Run hypermedia example
        run: moon run examples/hypermedia --target wasm-gc
      - name: Run catalog maintenance example
        run: moon run examples/maintenance --target wasm-gc
      - name: Run contract and incremental examples
        run: |
          moon run examples/contracts --target wasm-gc
          moon run examples/incremental_links --target wasm-gc
      - name: Run native benchmark workload
        run: moon run benchmarks/main --target native --release
      - name: Run API contract scenarios
        run: |
          moon run examples/contract_sdk --target wasm-gc
          moon run examples/contract_workspace --target wasm-gc
          moon run examples/contract_ci --target wasm-gc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Independent JSON Schema profile comparison
        run: |
          python -m pip install jsonschema==4.26.0
          python tools/compare_contract_oracle.py
      - name: Contract update cold-equivalence workload
        run: moon run benchmarks/contract_management --target native --release
